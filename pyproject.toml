[project]
name = "checkers-alpha"
version = "0.2.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
include = ["core", "training", "tests", "play.py", "train.py"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff.format]
quote-style = "single"
